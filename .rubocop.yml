# Omakase (Rails) + RuboCop alinhados ao Rails 8.1 e Ruby 3.4.
# https://github.com/rails/rubocop-rails-omakase
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

inherit_mode:
  merge:
    - Exclude
    - Include

AllCops:
  TargetRubyVersion: 3.4
  TargetRailsVersion: 8.1
  Exclude:
    - ".git/**/*"
    - "db/schema.rb"
    - "log/**/*"
    - "node_modules/**/*"
    - "storage/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

# Mesmo padrão de aspas duplas usado em app/config/lib (Omakase).
Style/StringLiterals:
  Include:
    - "spec/**/*"
