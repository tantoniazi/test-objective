# Imagem substituída no CI: __IMAGE__
# Crie o Secret antes do primeiro deploy, por exemplo:
# kubectl -n test-objective create secret generic test-objective-secrets \
#   --from-literal=RAILS_MASTER_KEY=... \
#   --from-literal=DATABASE_URL=postgres://...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-objective
  namespace: test-objective
  labels:
    app.kubernetes.io/name: test-objective
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: test-objective
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-objective
    spec:
      containers:
        - name: app
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - secretRef:
                name: test-objective-secrets
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
